services:
  postgres:
    image: postgres:16-alpine
    container_name: trizac-pg
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: trizac
      POSTGRES_PASSWORD: trizac
      POSTGRES_DB: trizac
    volumes:
      - trizac-pg-data:/var/lib/postgresql/data

volumes:
  trizac-pg-data:
